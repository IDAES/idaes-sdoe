[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idaes-sdoe"
version = "0.1.0"
description = "Standalone Python APIs for sequential design of experiments."
readme = "README.md"
authors = [
  {name = "Xiangyu Bi", email = "xbi@lbl.gov"},
  {name = "Dan Gunter"},
]
license = {file = "LICENSE.md"}
requires-python = ">=3.10"
dependencies = [
  "kaleido>=0.2.1,<1",
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=5.24",
  "python-tsp>=0.5.0",
  "scipy>=1.12",
]

[project.urls]
Homepage = "https://github.com/IDAES/idaes-sdoe"
Documentation = "https://idaes-sdoe.readthedocs.io"
Repository = "https://github.com/IDAES/idaes-sdoe"
Issues = "https://github.com/IDAES/idaes-sdoe/issues"

[project.optional-dependencies]
docs = [
  "pydata-sphinx-theme>=0.15",
  "sphinx>=7.4",
  "sphinx-copybutton>=0.5",
  "sphinx-marimo",
  "sphinx-book-theme",
]
mars = ["sklearn-contrib-py-earth>=0.1.0"]
notebook = [
  "ipykernel>=6.29",
  "notebook>=7.2",
]
marimo = ["marimo>=0.23.14"]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
