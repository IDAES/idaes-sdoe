# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  fail_on_warning: false
  configuration: docs/conf.py

# Install the package with its "docs" extra so autodoc can import the source
# and Sphinx has the theme and helper extensions available.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
